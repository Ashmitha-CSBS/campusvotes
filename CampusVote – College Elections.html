<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusVote – College Elections</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--sf:#fff;--tx:#1b2440;--mu:#5d6783;--bd:#d9deea;--pr:#26346b;--pt:#fff;--ac:#c8362b;--ok:#17805a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11162a;--sf:#1a2140;--tx:#eef0f8;--mu:#a2abc8;--bd:#2c3560;--pr:#8fa2ff;--pt:#11162a;--ac:#ff6b5e;--ok:#4cd6a0}}
:root[data-theme="dark"]{--bg:#11162a;--sf:#1a2140;--tx:#eef0f8;--mu:#a2abc8;--bd:#2c3560;--pr:#8fa2ff;--pt:#11162a;--ac:#ff6b5e;--ok:#4cd6a0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 'Source Serif 4',Georgia,serif}
h1,h2,h3,button,nav a,label,.sans{font-family:'Bricolage Grotesque',system-ui,sans-serif}
header{background:var(--pr);color:var(--pt);padding:18px 20px 0}
.top{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font:800 24px 'Bricolage Grotesque',sans-serif;letter-spacing:-.5px}
.logo i{display:inline-block;width:16px;height:16px;border:3px solid var(--pt);border-radius:3px;margin-right:8px;position:relative;top:1px}
.status{font:600 13px 'Bricolage Grotesque',sans-serif;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.18)}
nav{max-width:1000px;margin:14px auto 0;display:flex;gap:4px;overflow-x:auto}
nav a{padding:10px 16px;color:var(--pt);opacity:.75;text-decoration:none;font-weight:600;font-size:15px;border-radius:8px 8px 0 0;white-space:nowrap;cursor:pointer}
nav a.on{background:var(--bg);color:var(--tx);opacity:1}
main{max-width:1000px;margin:auto;padding:28px 20px 60px}
h2{font-size:30px;margin:0 0 6px;letter-spacing:-.5px}h3{margin:0 0 6px}
.mu{color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:16px 'Source Serif 4',serif}
input:focus,button:focus-visible,.cand:focus-visible,nav a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 20px;font-weight:600;font-size:15px;background:var(--pr);color:var(--pt)}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.red{background:var(--ac);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.msg{padding:11px 14px;border-radius:8px;margin-top:14px;font:600 14px 'Bricolage Grotesque',sans-serif}
.msg.e{background:rgba(200,54,43,.14);color:var(--ac)}.msg.o{background:rgba(23,128,90,.15);color:var(--ok)}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 20px 'Bricolage Grotesque',sans-serif;color:#fff;flex:none}
.cand{display:flex;gap:14px;align-items:center;padding:14px;border:2px solid var(--bd);border-radius:12px;background:var(--sf);cursor:pointer;margin-top:10px;text-align:left;width:100%;color:var(--tx);font-weight:400}
.cand.sel{border-color:var(--ac)}
.box{width:30px;height:30px;border:2px solid var(--mu);border-radius:5px;margin-left:auto;flex:none;display:grid;place-items:center;font:800 22px sans-serif;color:var(--ac)}
.cand.sel .box{border-color:var(--ac)}
.post{margin-top:28px}.post h3{font-size:21px;border-bottom:2px solid var(--tx);padding-bottom:6px}
.bar{height:26px;background:var(--bg);border-radius:6px;overflow:hidden;margin:5px 0 12px}
.bar b{display:block;height:100%;background:var(--pr);transition:width .7s}.bar b.w{background:var(--ac)}
.rl{display:flex;justify-content:space-between;font:600 15px 'Bricolage Grotesque',sans-serif}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}.stat{flex:1;min-width:130px}.stat b{font:800 32px 'Bricolage Grotesque',sans-serif;display:block}
.receipt{font:700 24px monospace;letter-spacing:2px;background:var(--bg);border:2px dashed var(--ac);padding:14px;text-align:center;border-radius:8px;margin:12px 0}
dialog{border:0;border-radius:14px;max-width:480px;width:calc(100% - 32px);background:var(--sf);color:var(--tx);padding:24px}
dialog::backdrop{background:rgba(10,14,30,.6)}
ul.pl{padding-left:20px;margin:8px 0}.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px;border-bottom:1px solid var(--bd);text-align:left}
.sw{overflow-x:auto}
</style></head><body>
<header><div class="top"><div class="logo"><i></i>CampusVote</div><div class="status" id="st"></div></div>
<nav id="nav"></nav></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script>
const POSTS=[
{id:"pres",t:"President",c:[
{id:"p1",n:"Ananya Reddy",d:"CSE · Year 3",m:"Make campus life transparent, connected and fun.",pl:["Monthly open-house with the principal","24×7 library during exams","Student-run feedback portal"],col:"#26346b"},
{id:"p2",n:"Rohan Verma",d:"ECE · Year 3",m:"Better labs, better placements, better canteen.",pl:["Industry mentorship for every branch","Upgrade lab equipment","Healthier, cheaper canteen menu"],col:"#0f7b83"},
{id:"p3",n:"Fatima Sheikh",d:"MBA · Year 2",m:"A campus that listens to every voice.",pl:["Anonymous grievance box","Scholarship awareness drives","Mental-health counsellor on campus"],col:"#8a3b8f"}]},
{id:"sec",t:"General Secretary",c:[
{id:"s1",n:"Karthik Nair",d:"MECH · Year 2",m:"Organised events, zero chaos.",pl:["Single event calendar","Fair budget for all clubs","Inter-college tech fest"],col:"#b5651d"},
{id:"s2",n:"Sneha Iyer",d:"IT · Year 3",m:"Digital-first administration for students.",pl:["Online bonafide and NOC requests","Campus Wi-Fi audit","Club registration app"],col:"#2e7d32"}]},
{id:"cul",t:"Cultural Secretary",c:[
{id:"c1",n:"Arjun Menon",d:"CIVIL · Year 2",m:"Every talent deserves a stage.",pl:["Monthly open-mic","Annual cultural week","Sports and arts exchange"],col:"#c8362b"},
{id:"c2",n:"Meera Joshi",d:"BBA · Year 3",m:"Culture that includes everyone.",pl:["Regional festival nights","Student film club","Free workshop series"],col:"#6a4fb3"},
{id:"c3",n:"Imran Khan",d:"EEE · Year 1",m:"Fresh ideas from a fresh face.",pl:["Freshers' mentoring evenings","Gaming and e-sports league","Rooftop music Fridays"],col:"#00796b"}]}];
const ADMIN_PW="admin123";
let S={voters:{},ballots:[],open:true,published:false},me=null,adm=false,tab="home",pick={},msg={};
try{const x=localStorage.getItem("cv_state");if(x)S=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem("cv_state",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of s)h=(h*33)^c.charCodeAt(0);return"f"+(h>>>0).toString(16)}}
const code=()=>Array.from({length:10},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("");
const ini=n=>n.split(" ").map(w=>w[0]).join("");
const av=c=>`<div class="av" style="background:${c.col}">${ini(c.n)}</div>`;
const showRes=()=>S.published||!S.open;
const TABS=[["home","Home"],["register","Register"],["vote","Vote"],["cands","Candidates"],["results","Results"],["admin","Admin"]];
function go(t){tab=t;msg={};render()}
function tally(){const r={};POSTS.forEach(p=>{r[p.id]={};p.c.forEach(c=>r[p.id][c.id]=0)});S.ballots.forEach(b=>{for(const p in b.ch)if(r[p]&&r[p][b.ch[p]]!==undefined)r[p][b.ch[p]]++});return r}
const note=k=>msg[k]?`<div class="msg ${msg[k][0]}" role="alert">${msg[k][1]}</div>`:"";

function render(){
 $("#st").textContent=S.open?"Voting open":"Voting closed";
 $("#nav").innerHTML=TABS.map(([k,l])=>`<a tabindex="0" role="button" class="${tab===k?"on":""}" onclick="go('${k}')" onkeydown="if(event.key==='Enter')go('${k}')">${l}</a>`).join("");
 $("#app").innerHTML=({home,register,vote,cands,results,admin})[tab]();
 const bars=document.querySelectorAll(".bar b[data-w]");bars.forEach(b=>{b.style.width="0";setTimeout(()=>b.style.width=b.dataset.w+"%",30)});
}

function home(){const n=Object.keys(S.voters).length,v=S.ballots.length;
return `<h2>Student Council Elections 2026</h2><p class="mu">Register once, vote once, and verify your ballot afterwards. No one can see how you voted.</p>
<div class="grid">
<div class="card"><h3>1. Register</h3><p class="mu">Sign up with your roll number, college email and a 4-digit PIN.</p><button onclick="go('register')">Register to vote</button></div>
<div class="card"><h3>2. Vote</h3><p class="mu">Log in, review candidates and cast your ballot for each post.</p><button onclick="go('vote')">Go to ballot</button></div>
<div class="card"><h3>3. See results</h3><p class="mu">Results appear once the election officer closes voting.</p><button class="alt" onclick="go('results')">View results</button></div></div>
<div class="card stats" style="margin-top:16px"><div class="stat"><b>${n}</b><span class="mu">Registered voters</span></div><div class="stat"><b>${v}</b><span class="mu">Votes cast</span></div><div class="stat"><b>${n?Math.round(v/n*100):0}%</b><span class="mu">Turnout</span></div></div>
<div class="card" style="margin-top:16px"><h3>How your vote stays secure</h3><ul class="pl"><li>PINs are stored only as SHA-256 hashes.</li><li>Ballots are saved separately from voter identity, so votes are anonymous.</li><li>Each voter is marked as voted and cannot vote twice.</li><li>Your receipt code lets you confirm your ballot was counted.</li></ul>
<p class="mu sans" style="font-size:14px">Demo tip: use the Admin tab (password <b>admin123</b>) to load sample voters and votes.</p></div>`}

function register(){return `<h2>Voter registration</h2><p class="mu">Only enrolled students may register.</p>
<div class="card" style="max-width:520px"><label for="rn">Full name</label><input id="rn" autocomplete="name">
<label for="rr">Roll number (e.g. 22CS101)</label><input id="rr" placeholder="22CS101">
<label for="re">College email</label><input id="re" type="email" placeholder="you@college.edu">
<label for="rd">Department</label><select id="rd"><option>CSE</option><option>ECE</option><option>EEE</option><option>MECH</option><option>CIVIL</option><option>IT</option><option>MBA</option></select>
<label for="rp">Choose a 4-digit PIN</label><input id="rp" type="password" inputmode="numeric" maxlength="4">
<div class="row"><button onclick="doReg()">Register</button></div>${note("reg")}</div>`}
async function doReg(){const n=$("#rn").value.trim(),r=$("#rr").value.trim().toUpperCase(),e=$("#re").value.trim(),d=$("#rd").value,p=$("#rp").value;
 const fail=t=>{msg.reg=["e",t];render()};
 if(n.length<3)return fail("Enter your full name.");
 if(!/^\d{2}[A-Z]{2,4}\d{2,4}$/.test(r))return fail("Roll number must look like 22CS101.");
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return fail("Enter a valid email address.");
 if(!/^\d{4}$/.test(p))return fail("PIN must be exactly 4 digits.");
 if(S.voters[r])return fail("This roll number is already registered. Go to Vote and log in.");
 S.voters[r]={name:n,email:e,dept:d,h:await hash(r+":"+p),voted:false};save();
 msg.reg=["o","Registered. You can now log in from the Vote tab."];render()}

function vote(){
 if(!S.open)return `<h2>Voting is closed</h2><p class="mu">The election has ended. Check the Results tab.</p>`;
 if(!me)return `<h2>Voter login</h2><div class="card" style="max-width:520px"><label for="lr">Roll number</label><input id="lr" placeholder="22CS101">
 <label for="lp">PIN</label><input id="lp" type="password" inputmode="numeric" maxlength="4" onkeydown="if(event.key==='Enter')doLogin()">
 <div class="row"><button onclick="doLogin()">Log in</button><button class="alt" onclick="go('register')">Need to register?</button></div>${note("login")}</div>`;
 const v=S.voters[me];
 if(v.voted)return `<h2>Thanks, ${esc(v.name.split(" ")[0])}</h2><div class="card"><p>Your vote is recorded. You can only vote once.</p>${msg.rc?`<p class="sans">Save your receipt code:</p><div class="receipt">${msg.rc}</div><p class="mu">Use it in Results → Verify receipt to confirm your ballot was counted.</p>`:""}<div class="row"><button class="alt" onclick="me=null;msg={};render()">Log out</button></div></div>`;
 return `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><h2>Your ballot</h2><p class="mu">Select one candidate per post, or skip a post.</p></div><button class="alt" style="align-self:start" onclick="me=null;pick={};render()">Log out</button></div>
 ${POSTS.map(p=>`<div class="post"><h3>${p.t}</h3>${p.c.map(c=>`<button class="cand ${pick[p.id]===c.id?"sel":""}" onclick="pk('${p.id}','${c.id}')" aria-pressed="${pick[p.id]===c.id}">${av(c)}<span><b class="sans">${c.n}</b><br><span class="mu" style="font-size:14px">${c.d}</span></span><span class="box">${pick[p.id]===c.id?"✕":""}</span></button>`).join("")}</div>`).join("")}
 <div class="row"><button class="red" onclick="review()">Review and submit</button></div>${note("bal")}`}
function pk(p,c){pick[p]=pick[p]===c?null:c;render()}
async function doLogin(){const r=$("#lr").value.trim().toUpperCase(),p=$("#lp").value,v=S.voters[r];
 if(!v||v.h!==await hash(r+":"+p)){msg.login=["e","Roll number or PIN is incorrect."];return render()}
 me=r;pick={};msg={};render()}
function review(){const sel=POSTS.filter(p=>pick[p.id]);
 if(!sel.length){msg.bal=["e","Select at least one candidate before submitting."];return render()}
 $("#dlg").innerHTML=`<h3>Confirm your vote</h3><p class="mu">You cannot change it after submitting.</p><table>${POSTS.map(p=>{const c=p.c.find(x=>x.id===pick[p.id]);return`<tr><td>${p.t}</td><td><b>${c?c.n:"Skipped"}</b></td></tr>`}).join("")}</table>
 <div class="row"><button class="red" onclick="submitVote()">Submit vote</button><button class="alt" onclick="$('#dlg').close()">Go back</button></div>`;$("#dlg").showModal()}
async function submitVote(){const v=S.voters[me];if(v.voted||!S.open){$("#dlg").close();return}
 const ch={};POSTS.forEach(p=>{if(pick[p.id])ch[p.id]=pick[p.id]});
 const rc=code();S.ballots.push({rh:await hash(rc),ch});v.voted=true;save();
 $("#dlg").close();msg={rc};pick={};render()}

function cands(){return `<h2>Candidate profiles</h2><p class="mu">Select a candidate to read the full manifesto.</p>`+POSTS.map(p=>`<div class="post"><h3>${p.t}</h3><div class="grid" style="margin-top:12px">${p.c.map(c=>`<button class="cand" style="margin:0" onclick="prof('${p.id}','${c.id}')">${av(c)}<span><b class="sans">${c.n}</b><br><span class="mu" style="font-size:14px">${c.d}</span></span></button>`).join("")}</div></div>`).join("")}
function prof(pid,cid){const p=POSTS.find(x=>x.id===pid),c=p.c.find(x=>x.id===cid);
 $("#dlg").innerHTML=`<div style="display:flex;gap:14px;align-items:center">${av(c)}<div><h3 style="margin:0">${c.n}</h3><span class="mu">${c.d} · Running for ${p.t}</span></div></div><p style="font-size:18px">“${c.m}”</p><b class="sans">Key promises</b><ul class="pl">${c.pl.map(x=>`<li>${x}</li>`).join("")}</ul><div class="row"><button onclick="$('#dlg').close()">Close</button></div>`;$("#dlg").showModal()}

function results(){
 const verify=`<div class="card" style="margin-top:22px;max-width:520px"><h3>Verify receipt</h3><label for="vr">Receipt code</label><input id="vr" placeholder="10-character code"><div class="row"><button class="alt" onclick="verify()">Check</button></div>${note("ver")}</div>`;
 if(!showRes())return `<h2>Results</h2><div class="card"><p>Results are hidden while voting is open. They are published when the election officer closes the election.</p><p class="mu">Votes cast so far: <b>${S.ballots.length}</b></p></div>${verify}`;
 const t=tally(),n=Object.keys(S.voters).length;
 return `<h2>Election results</h2><p class="mu">${S.ballots.length} votes from ${n} registered voters (${n?Math.round(S.ballots.length/n*100):0}% turnout)</p>`+POSTS.map(p=>{const tot=Object.values(t[p.id]).reduce((a,b)=>a+b,0),mx=Math.max(...Object.values(t[p.id])),sorted=[...p.c].sort((a,b)=>t[p.id][b.id]-t[p.id][a.id]);
 return `<div class="card post" style="margin-top:16px"><h3>${p.t}</h3>${sorted.map(c=>{const k=t[p.id][c.id],pc=tot?Math.round(k/tot*100):0,w=k===mx&&k>0;return `<div class="rl"><span>${c.n}${w?" · Leading":""}</span><span>${k} votes (${pc}%)</span></div><div class="bar"><b class="${w?"w":""}" data-w="${pc}"></b></div>`}).join("")}</div>`}).join("")+verify}
async function verify(){const c=$("#vr").value.trim().toUpperCase(),h=await hash(c);
 msg.ver=c&&S.ballots.some(b=>b.rh===h)?["o","Verified. Your ballot is in the count."]:["e","No ballot matches that code."];render()}

function admin(){
 if(!adm)return `<h2>Election officer</h2><div class="card" style="max-width:520px"><label for="ap">Admin password</label><input id="ap" type="password" onkeydown="if(event.key==='Enter')alog()"><div class="row"><button onclick="alog()">Log in</button></div>${note("adm")}<p class="mu sans" style="font-size:14px">Demo password: admin123</p></div>`;
 const n=Object.keys(S.voters).length;
 return `<h2>Admin dashboard</h2><div class="card stats"><div class="stat"><b>${n}</b><span class="mu">Registered</span></div><div class="stat"><b>${S.ballots.length}</b><span class="mu">Votes cast</span></div><div class="stat"><b>${S.open?"Open":"Closed"}</b><span class="mu">Election status</span></div></div>
 <div class="row"><button class="${S.open?"red":""}" onclick="toggle()">${S.open?"Close election and publish results":"Reopen election"}</button><button class="alt" onclick="demo()">Load demo voters and votes</button><button class="alt" onclick="reset()">Reset everything</button><button class="alt" onclick="adm=false;render()">Log out</button></div>${note("adm")}
 <div class="card sw" style="margin-top:16px"><h3>Voter roll</h3><p class="mu">Shows who voted, never how they voted.</p><table><tr><th>Roll</th><th>Name</th><th>Dept</th><th>Status</th></tr>${Object.entries(S.voters).map(([r,v])=>`<tr><td>${r}</td><td>${esc(v.name)}</td><td>${v.dept}</td><td>${v.voted?"Voted":"Not voted"}</td></tr>`).join("")||"<tr><td colspan=4 class=mu>No voters yet.</td></tr>"}</table></div>`}
function alog(){if($("#ap").value===ADMIN_PW){adm=true;msg={}}else msg.adm=["e","Incorrect password."];render()}
function toggle(){S.open=!S.open;S.published=!S.open;save();msg.adm=["o",S.open?"Election reopened.":"Election closed. Results are now public."];render()}
async function demo(){const names=["Aditya Rao","Bhavna Shah","Chaitanya K","Divya Pillai","Eshwar Das","Farah Ali","Gautham R","Harini S","Ishaan Gupta","Jaya Lakshmi","Kiran Kumar","Lavanya M","Manoj T","Nisha Patel","Omkar Joshi","Pooja Reddy","Qasim Hussain","Rhea Sen","Sai Teja","Tanvi Rao"];
 for(let i=0;i<names.length;i++){const r="24CS"+(200+i);if(S.voters[r])continue;S.voters[r]={name:names[i],email:r.toLowerCase()+"@college.edu",dept:"CSE",h:await hash(r+":1234"),voted:i<16};
 if(i<16){const ch={};POSTS.forEach(p=>{if(Math.random()>.1)ch[p.id]=p.c[Math.random()<.5?0:Math.random()*p.c.length|0].id});S.ballots.push({rh:await hash(code()),ch})}}
 save();msg.adm=["o","Added 20 demo voters (PIN 1234, roll 24CS200–24CS219) with 16 votes."];render()}
function reset(){$("#dlg").innerHTML=`<h3>Reset everything?</h3><p class="mu">This deletes all registered voters and votes and reopens the election. It cannot be undone.</p><div class="row"><button class="red" onclick="doReset()">Yes, reset</button><button class="alt" onclick="$('#dlg').close()">Cancel</button></div>`;$("#dlg").showModal()}
function doReset(){$("#dlg").close();S={voters:{},ballots:[],open:true,published:false};me=null;pick={};save();msg.adm=["o","Election reset. All voters and votes were deleted."];render()}
render();
</script></body></html>
